# One-click deploy to Render.com
services:
  - type: web
    name: algolotl
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python scripts/generate.py"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ALGO_ENVIRONMENT
        value: production
      - key: ALGO_SECRET_KEY
        generateValue: true
      - key: ALGO_DATA_DIR
        value: /var/data
    disk:
      name: algolotl-data
      mountPath: /var/data
      sizeGB: 1
